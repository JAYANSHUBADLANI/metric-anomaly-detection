[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metric-anomaly-detection"
version = "0.1.0"
description = "Statistical anomaly detection for business KPIs and time series, with core methods implemented from scratch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Jayanshu Badlani", email = "badlanijayanshu@gmail.com" },
]
keywords = [
    "anomaly-detection",
    "time-series",
    "control-charts",
    "cusum",
    "ewma",
    "kpi-monitoring",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/JayanshuBadlani/metric-anomaly-detection"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
